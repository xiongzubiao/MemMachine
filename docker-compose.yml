services:
  # MemMachine application
  memmachine:
    image: ${MEMMACHINE_IMAGE:-memmachine/memmachine}
    pull_policy: ${PULL_POLICY:-always}
    container_name: memmachine-app
    restart: unless-stopped
    ports:
      - "${MEMORY_SERVER_PORT:-8080}:8080"
    environment:
      # Application configuration
      MEMORY_CONFIG: ${MEMORY_CONFIG:-/app/configuration.yml}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://memmachine:8080}
      GATEWAY_URL: ${GATEWAY_URL:-http://localhost:8080}
      FAST_MCP_LOG_LEVEL: ${FAST_MCP_LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MEMMACHINE_WORKERS: ${MEMMACHINE_WORKERS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
    volumes:
      - ./configuration.yml:/app/configuration.yml:ro,Z
      - memmachine_logs:/tmp/memory_logs
      - memmachine_profile_data:/tmp/memmachine_profile_data
      - memmachine_graph_data:/tmp/memmachine_graph_data
      - memmachine_chroma_data:/tmp/memmachine_chroma_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - memmachine-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  memmachine_profile_data:
    driver: local
  memmachine_graph_data:
    driver: local
  memmachine_chroma_data:
    driver: local
  memmachine_logs:
    driver: local

networks:
  memmachine-network:
    driver: bridge
    name: memmachine-network
